<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IA Reconocimiento Facial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; text-align: center; }
        .cam-box { width: 320px; height: 320px; margin: 20px auto; border: 4px solid #00d1b2; border-radius: 15px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #resultado { font-size: 2rem; color: #00d1b2; font-weight: bold; }
    </style>
</head>
<body>
    <div id="status" class="alert alert-info m-3">Inicializando...</div>
    <div class="cam-box"><video id="video" playsinline autoplay></video></div>
    <div id="resultado">Esperando...</div>
    <canvas id="hidden_canvas" width="150" height="150" style="display: none;"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <script>
        let modelo = null;
        const PERSONAS = ["Daniela", "Fajardo", "Gabriel", "Idney", "Jesús", "Kevin", "Victor"];

        async function init() {
            const status = document.getElementById("status");
            
            try {
                // 1. Cargar el modelo con un truco para evitar la caché
                modelo = await tf.loadLayersModel('./model.json?v=' + Date.now());
                status.innerText = "Modelo cargado ✅";
                
                // 2. Pedir cámara
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                document.getElementById("video").srcObject = stream;
                
                status.innerText = "¡IA LISTA! ✅";
                status.className = "alert alert-success m-3";
                
                // Empezar a predecir
                predecir();
            } catch (err) {
                status.innerText = "Error: " + err.message;
                status.className = "alert alert-danger m-3";
            }
        }

        async function predecir() {
            if (modelo) {
                const video = document.getElementById("video");
                const canvas = document.getElementById("hidden_canvas");
                const ctx = canvas.getContext("2d");
                
                ctx.drawImage(video, 0, 0, 150, 150);
                const tensor = tf.tidy(() => {
                    return tf.browser.fromPixels(canvas).toFloat().div(255).expandDims(0);
                });

                const pred = await modelo.predict(tensor).data();
                const max = Math.max(...pred);
                const idx = pred.indexOf(max);

                document.getElementById("resultado").innerText = max > 0.65 ? PERSONAS[idx] : "Identificando...";
            }
            setTimeout(predecir, 600);
        }
        window.onload = init;
    </script>
</body>
</html>
