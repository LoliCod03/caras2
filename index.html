<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IA Reconocimiento Facial - Fix Final</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; text-align: center; }
        .cam-box { width: 320px; height: 320px; margin: 20px auto; border: 4px solid #00d1b2; border-radius: 15px; overflow: hidden; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #resultado { font-size: 2rem; color: #00d1b2; font-weight: bold; }
    </style>
</head>
<body>
    <div id="status" class="alert alert-info m-3">Reparando modelo...</div>
    <div class="cam-box"><video id="video" playsinline autoplay muted></video></div>
    <div id="resultado">Esperando...</div>
    <canvas id="hidden_canvas" width="150" height="150" style="display: none;"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <script>
        let modelo = null;
        const PERSONAS = ["Daniela", "Fajardo", "Gabriel", "Idney", "Jesús", "Kevin", "Victor"];

        // REPARADOR AVANZADO
        function limpiarKeras3(obj) {
            if (typeof obj !== 'object' || obj === null) return obj;

            if (Array.isArray(obj)) return obj.map(limpiarKeras3);

            const res = {};
            for (let key in obj) {
                let value = obj[key];
                
                // 1. Cambiar batch_shape
                let newKey = (key === 'batch_shape') ? 'batch_input_shape' : key;

                // 2. ELIMINAR inbound_nodes conflictivos
                // Keras 3 los guarda como objetos, pero TFJS espera arrays o nada.
                // Al borrarlos en las capas de configuración, TFJS los reconstruye solo.
                if (key === 'inbound_nodes') {
                    continue; 
                }

                res[newKey] = limpiarKeras3(value);
            }
            return res;
        }

        async function init() {
            const status = document.getElementById("status");
            try {
                // 1. Cargar JSON original
                const response = await fetch('./model.json?v=' + Date.now());
                const json = await response.json();

                // 2. Limpiar topología
                json.modelTopology = limpiarKeras3(json.modelTopology);
                
                // 3. Cargar modelo correctamente (un solo argumento)
                modelo = await tf.loadLayersModel(tf.io.fromMemory({
                    modelTopology: json.modelTopology,
                    weightsManifest: json.weightsManifest,
                    format: json.format,
                    generatedBy: json.generatedBy
                }));

                status.innerText = "IA Cargada ✅";
                
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                document.getElementById("video").srcObject = stream;
                status.className = "alert alert-success m-3";
                predecir();

            } catch (err) {
                console.error(err);
                status.innerText = "Error: " + err.message;
                status.className = "alert alert-danger m-3";
            }
        }

        async function predecir() {
            if (modelo) {
                const video = document.getElementById("video");
                const canvas = document.getElementById("hidden_canvas");
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, 150, 150);

                const tensor = tf.tidy(() => {
                    return tf.browser.fromPixels(canvas).toFloat().div(255).expandDims(0);
                });

                const pred = await modelo.predict(tensor).data();
                const idx = pred.indexOf(Math.max(...pred));
                document.getElementById("resultado").innerText = Math.max(...pred) > 0.65 ? PERSONAS[idx] : "...";
            }
            setTimeout(predecir, 600);
        }
        window.onload = init;
    </script>
</body>
</html>
