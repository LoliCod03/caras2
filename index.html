<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IA Reconocimiento Facial - Fix Keras 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; text-align: center; }
        .cam-box { width: 320px; height: 320px; margin: 20px auto; border: 4px solid #00d1b2; border-radius: 15px; overflow: hidden; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #resultado { font-size: 2rem; color: #00d1b2; font-weight: bold; }
    </style>
</head>
<body>
    <div id="status" class="alert alert-info m-3">Reparando estructura interna...</div>
    <div class="cam-box"><video id="video" playsinline autoplay muted></video></div>
    <div id="resultado">Esperando...</div>
    <canvas id="hidden_canvas" width="150" height="150" style="display: none;"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <script>
        let modelo = null;
        const PERSONAS = ["Daniela", "Fajardo", "Gabriel", "Idney", "Jesús", "Kevin", "Victor"];

        // REPARADOR DE ARQUITECTURA KERAS 3 -> TFJS
        function fixModelTopology(obj) {
            if (typeof obj !== 'object' || obj === null) return obj;

            if (Array.isArray(obj)) return obj.map(fixModelTopology);

            const newObj = {};
            for (let key in obj) {
                let value = obj[key];

                // 1. Corregir batch_shape
                if (key === 'batch_shape') {
                    newObj['batch_input_shape'] = fixModelTopology(value);
                    continue;
                }

                // 2. Corregir el error crítico de nodeData
                // Si encontramos inbound_nodes que no es un array, lo convertimos
                // al formato antiguo o lo dejamos vacío para que TFJS no explote.
                if (key === 'inbound_nodes') {
                    if (Array.isArray(value)) {
                        newObj[key] = fixModelTopology(value);
                    } else {
                        // Si es un objeto (formato Keras 3), lo forzamos a ser un array vacío
                        // Esto suele funcionar en modelos Sequential que envuelven un Functional
                        newObj[key] = [];
                    }
                    continue;
                }
                
                // 3. Limpiar referencias a DTypePolicy (otra causa de errores)
                if (key === 'dtype' && typeof value === 'object') {
                    newObj[key] = value.config ? value.config.name : 'float32';
                    continue;
                }

                newObj[key] = fixModelTopology(value);
            }
            return newObj;
        }

        async function init() {
            const status = document.getElementById("status");
            try {
                status.innerText = "Descargando model.json...";
                const response = await fetch('./model.json?v=' + Date.now());
                const modelData = await response.json();

                status.innerText = "Parcheando incompatibilidades...";
                // Reparamos toda la configuración del modelo
                if (modelData.modelTopology) {
                    modelData.modelTopology = fixModelTopology(modelData.modelTopology);
                    // Forzar versión de Keras compatible
                    modelData.modelTopology.keras_version = "2.15.0"; 
                }

                status.innerText = "Cargando modelo reparado...";
                // Cargamos usando el objeto ya "traducido"
                modelo = await tf.loadLayersModel(tf.io.fromMemory(modelData));

                status.innerText = "IA LISTA ✅. Iniciando cámara...";
                status.className = "alert alert-success m-3";

                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                document.getElementById("video").srcObject = stream;
                predecir();

            } catch (err) {
                console.error("Error detallado:", err);
                status.innerText = "Error: " + err.message;
                status.className = "alert alert-danger m-3";
            }
        }

        async function predecir() {
            if (modelo) {
                const video = document.getElementById("video");
                const canvas = document.getElementById("hidden_canvas");
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, 150, 150);

                const tensor = tf.tidy(() => {
                    return tf.browser.fromPixels(canvas).toFloat().div(255).expandDims(0);
                });

                const pred = await modelo.predict(tensor).data();
                const idx = pred.indexOf(Math.max(...pred));
                document.getElementById("resultado").innerText = Math.max(...pred) > 0.65 ? PERSONAS[idx] : "...";
            }
            setTimeout(predecir, 600);
        }
        window.onload = init;
    </script>
</body>
</html>
