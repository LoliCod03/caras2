<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IA Reconocimiento Facial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; text-align: center; font-family: sans-serif; }
        .cam-box { width: 320px; height: 320px; margin: 20px auto; border: 4px solid #00d1b2; border-radius: 15px; overflow: hidden; background: black; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #resultado { font-size: 2.2rem; color: #00d1b2; font-weight: bold; margin-top: 10px; }
        .alert { font-size: 0.9rem; margin: 15px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="status" class="alert alert-info">Inicializando sistema...</div>
    
    <div class="cam-box">
        <video id="video" playsinline autoplay muted></video>
    </div>

    <div id="resultado">Esperando...</div>
    
    <canvas id="hidden_canvas" width="150" height="150" style="display: none;"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <script>
        let modelo = null;
        const PERSONAS = ["Daniela", "Fajardo", "Gabriel", "Idney", "Jesús", "Kevin", "Victor"];

        async function init() {
            const status = document.getElementById("status");
            const video = document.getElementById("video");
            
            try {
                // 1. Carga del modelo (forzando actualización con Date.now)
                status.innerText = "Cargando IA (paso 1/2)...";
                modelo = await tf.loadLayersModel('./model.json?v=' + Date.now());
                console.log("Modelo cargado correctamente");
                
                // 2. Acceso a la cámara
                status.innerText = "Abriendo cámara (paso 2/2)...";
                const constraints = { 
                    audio: false, 
                    video: { facingMode: "user", width: { ideal: 400 }, height: { ideal: 400 } } 
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;

                // Esperar a que el video esté listo para empezar a predecir
                video.onloadedmetadata = () => {
                    status.innerText = "¡IA LISTA! ✅";
                    status.className = "alert alert-success";
                    predecir();
                };

            } catch (err) {
                console.error("Error detallado:", err);
                status.innerText = "Error: " + err.message;
                status.className = "alert alert-danger";
            }
        }

        async function predecir() {
            if (modelo) {
                const video = document.getElementById("video");
                const canvas = document.getElementById("hidden_canvas");
                const ctx = canvas.getContext("2d");
                
                // Dibujar el frame actual del video en el canvas pequeño
                ctx.drawImage(video, 0, 0, 150, 150);

                // Procesar la imagen para la IA
                const prediccion = tf.tidy(() => {
                    const tensor = tf.browser.fromPixels(canvas)
                        .toFloat()
                        .div(255.0) // Normalizar de 0-255 a 0-1
                        .expandDims(0);
                    return modelo.predict(tensor).dataSync();
                });

                // Obtener el resultado con mayor probabilidad
                const maxProb = Math.max(...prediccion);
                const index = prediccion.indexOf(maxProb);

                // Mostrar el nombre si la confianza es mayor al 65%
                const elementoResultado = document.getElementById("resultado");
                if (maxProb > 0.65) {
                    elementoResultado.innerText = PERSONAS[index];
                } else {
                    elementoResultado.innerText = "Identificando...";
                }
            }
            
            // Repetir el proceso cada 600ms para no saturar el móvil
            setTimeout(predecir, 600);
        }

        // Iniciar todo al cargar la página
        window.onload = init;
    </script>
</body>
</html>
