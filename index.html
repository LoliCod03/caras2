<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IA Reconocimiento Facial - Fix Final</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; text-align: center; }
        .cam-box { width: 320px; height: 320px; margin: 20px auto; border: 4px solid #00d1b2; border-radius: 15px; overflow: hidden; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #resultado { font-size: 2rem; color: #00d1b2; font-weight: bold; }
    </style>
</head>
<body>
    <div id="status" class="alert alert-info m-3">Reparando compatibilidad...</div>
    <div class="cam-box"><video id="video" playsinline autoplay muted></video></div>
    <div id="resultado">Esperando...</div>
    <canvas id="hidden_canvas" width="150" height="150" style="display: none;"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <script>
        let modelo = null;
        const PERSONAS = ["Daniela", "Fajardo", "Gabriel", "Idney", "Jesús", "Kevin", "Victor"];

        // REPARADOR DE COMPATIBILIDAD KERAS 3 -> TFJS
        function fixKeras3Structure(obj) {
            if (typeof obj !== 'object' || obj === null) return obj;

            if (Array.isArray(obj)) return obj.map(fixKeras3Structure);

            const newObj = {};
            for (let key in obj) {
                let value = obj[key];

                // Fix 1: batch_shape -> batch_input_shape
                if (key === 'batch_shape') {
                    newObj['batch_input_shape'] = fixKeras3Structure(value);
                    continue;
                }

                // Fix 2: El error de forEach/nodeData
                // Si inbound_nodes es un objeto o está mal formado, TFJS falla.
                // Lo convertimos en una lista vacía si no es un array.
                if (key === 'inbound_nodes') {
                    newObj[key] = Array.isArray(value) ? fixKeras3Structure(value) : [];
                    continue;
                }

                newObj[key] = fixKeras3Structure(value);
            }
            return newObj;
        }

        async function init() {
            const status = document.getElementById("status");
            try {
                status.innerText = "Descargando modelo...";
                const response = await fetch('./model.json?v=' + Date.now());
                const modelData = await response.json();

                status.innerText = "Traduciendo formato Keras 3...";
                // Aplicamos la reparación a la topología del modelo
                modelData.modelTopology = fixKeras3Structure(modelData.modelTopology);

                status.innerText = "Cargando pesos en memoria...";
                // Carga del modelo usando el objeto reparado
                modelo = await tf.loadLayersModel(tf.io.fromMemory(modelData));

                status.innerText = "IA LISTA ✅. Iniciando cámara...";
                status.className = "alert alert-success m-3";

                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                document.getElementById("video").srcObject = stream;
                
                predecir();

            } catch (err) {
                console.error("Detalle del error:", err);
                status.innerText = "Error: " + err.message;
                status.className = "alert alert-danger m-3";
            }
        }

        async function predecir() {
            if (modelo) {
                const video = document.getElementById("video");
                const canvas = document.getElementById("hidden_canvas");
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, 150, 150);

                const tensor = tf.tidy(() => {
                    return tf.browser.fromPixels(canvas).toFloat().div(255).expandDims(0);
                });

                const pred = await modelo.predict(tensor).data();
                const idx = pred.indexOf(Math.max(...pred));
                document.getElementById("resultado").innerText = Math.max(...pred) > 0.65 ? PERSONAS[idx] : "...";
            }
            setTimeout(predecir, 600);
        }
        window.onload = init;
    </script>
</body>
</html>
